<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STEM & Healthcare Career Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .quiz-container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      overflow: hidden;
      margin: 10px auto;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 32px 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    /* PROGRESS BAR */
    .progress-bar-container {
      background: #e2e8f0;
      height: 6px;
      width: 100%;
    }

    .progress-fill {
      background: #2563eb;
      height: 100%;
      width: 20%;
      transition: width 0.3s ease;
    }

    /* CARD CONTENT */
    .card-body {
      padding: 24px;
    }

    .step-indicator {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      line-height: 1.35;
    }

    /* OPTIONS */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 56px;
    }

    .option-card:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }

    .option-card.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option-card input[type="radio"] {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      flex-shrink: 0;
    }

    .option-label {
      font-size: 0.95rem;
      color: #334155;
      font-weight: 500;
      line-height: 1.4;
    }

    .option-card.selected .option-label {
      color: #1e40af;
      font-weight: 600;
    }

    /* NAV BUTTONS */
    .actions-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    .btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* RESULTS VIEW */
    .results-view {
      display: none;
    }

    .top-result-box {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-top {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .top-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .top-desc {
      font-size: 0.95rem;
      color: #1e40af;
      line-height: 1.5;
    }

    .scores-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .score-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 6px;
    }

    .score-bar-bg {
      background: #e2e8f0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .score-bar-fill {
      background: #2563eb;
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* PRINT STYLING */
    @media print {
      body { background: #ffffff; padding: 0; }
      .quiz-container { box-shadow: none; border-radius: 0; max-width: 100%; }
      .actions-row, .progress-bar-container { display: none !important; }
      .results-view { display: block !important; }
      .quiz-card { display: none !important; }
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 1.35rem; }
      .card-body { padding: 18px; }
      .question-title { font-size: 1.1rem; }
      .btn { width: 100%; }
      .actions-row { flex-direction: column-reverse; }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div class="header">
      <h1>STEM & Healthcare Career Quiz</h1>
      <p>Discover which engineering or health-tech path aligns with your natural skills.</p>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="card-body">
      <!-- QUESTION VIEW -->
      <div id="quizView" class="quiz-card">
        <span class="step-indicator" id="stepIndicator">QUESTION 1 OF 5</span>
        <h2 class="question-title" id="questionTitle">Loading...</h2>

        <div class="options-grid" id="optionsContainer">
          <!-- Options rendered dynamically -->
        </div>

        <div class="actions-row">
          <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()" disabled>Back</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
      </div>

      <!-- RESULTS VIEW -->
      <div id="resultsView" class="results-view">
        <div class="top-result-box">
          <span class="badge-top">Your Primary Career Match</span>
          <h2 class="top-title" id="topCareerTitle">Biomedical Engineer</h2>
          <p class="top-desc" id="topCareerDesc"></p>
        </div>

        <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #0f172a;">All Career Match Percentages:</h3>
        <div class="scores-list" id="scoresList"></div>

        <div class="actions-row">
          <button class="btn btn-secondary" onclick="restartQuiz()">Restart Quiz</button>
          <button class="btn btn-primary" onclick="printResults()">Print / Save PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const quizData = [
      {
        question: "What type of problems do you enjoy solving most?",
        options: [
          { key: 'A', text: "A) Designing high-tech gadgets that can help save lives or monitor health." },
          { key: 'B', text: "B) Figuring out how engines, gears, machines, or moving parts work together." },
          { key: 'C', text: "C) Using specialized medical machines to see inside things and spot hidden details." },
          { key: 'D', text: "D) Planning large construction projects like bridges, roads, or eco-friendly buildings." },
          { key: 'E', text: "E) Creating healthy meal plans and exploring how food affects energy and wellness." }
        ]
      },
      {
        question: "Which school subject or lab activity sounds most exciting to you?",
        options: [
          { key: 'A', text: "A) Biology + Physics lab (e.g., studying how muscles move or building artificial joints)." },
          { key: 'B', text: "B) Physics + Geometry (e.g., building straw towers or studying forces and motion)." },
          { key: 'C', text: "C) Human Anatomy + Imaging (e.g., studying human bones and how X-rays work)." },
          { key: 'D', text: "D) Geography + Mathematics (e.g., calculating weights, terrain, and map layouts)." },
          { key: 'E', text: "E) Chemistry + Biology (e.g., studying nutrients, calories, and body metabolism)." }
        ]
      },
      {
        question: "If you had 30 minutes to work on a hands-on project today, what would you choose?",
        options: [
          { key: 'A', text: "A) Sketch a mechanical prosthetic arm with rubber bands and levers." },
          { key: 'B', text: "B) Take apart a mechanical clock or toy car to see how the gears mesh." },
          { key: 'C', text: "C) Examine anatomical charts and learn how diagnostic scanners work." },
          { key: 'D', text: "D) Build a model bridge out of popsicle sticks and test how much weight it holds." },
          { key: 'E', text: "E) Compare the nutrition labels of 3 favorite snacks and calculate their fiber and protein ratios." }
        ]
      },
      {
        question: "What kind of work environment do you see yourself enjoying most?",
        options: [
          { key: 'A', text: "A) A high-tech medical research lab or device manufacturing facility." },
          { key: 'B', text: "B) A workshop, automotive plant, or robotics lab with heavy machinery and CAD software." },
          { key: 'C', text: "C) A hospital diagnostic suite operating advanced scanners alongside medical teams." },
          { key: 'D', text: "D) An active construction site or engineering office planning urban infrastructure." },
          { key: 'E', text: "E) A health clinic, sports center, or hospital advising patients on nutrition." }
        ]
      },
      {
        question: "What is your primary career superpower?",
        options: [
          { key: 'A', text: "A) Combining biology with technical design to solve health challenges." },
          { key: 'B', text: "B) Understanding physical forces, mechanics, and 3D space." },
          { key: 'C', text: "C) High attention to detail and precision with diagnostic technology." },
          { key: 'D', text: "D) Thinking big and designing structures that whole communities rely on." },
          { key: 'E', text: "E) Empathy, active listening, and a passion for healthy living." }
        ]
      }
    ];

    const careerProfiles = {
      'A': { title: "Biomedical Engineer", desc: "You love bridging medicine and technology to design life-saving devices, prosthetics, and health-monitoring equipment." },
      'B': { title: "Mechanical Engineer", desc: "You have a natural knack for machinery, engines, physical forces, robotics, and moving parts." },
      'C': { title: "Radiologic Technologist", desc: "You excel in precision and tech-driven diagnostic imaging inside healthcare (X-Rays, MRIs, CT Scans)." },
      'D': { title: "Civil & Infrastructure Engineer", desc: "You are a big-picture thinker who wants to build the physical world around us—bridges, roads, eco-friendly buildings, and urban systems." },
      'E': { title: "Clinical Dietitian & Nutritionist", desc: "You are passionate about human wellness, nutrition science, metabolism, and helping people lead healthier lives." }
    };

    let currentQuestionIndex = 0;
    let selectedAnswers = {};

    function renderQuestion() {
      const q = quizData[currentQuestionIndex];
      document.getElementById('stepIndicator').innerText = `QUESTION ${currentQuestionIndex + 1} OF ${quizData.length}`;
      document.getElementById('questionTitle').innerText = q.question;

      const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progressFill').style.width = `${progressPercent}%`;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      q.options.forEach(option => {
        const isSelected = selectedAnswers[currentQuestionIndex] === option.key;
        const card = document.createElement('label');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        
        card.innerHTML = `
          <input type="radio" name="q_option" value="${option.key}" ${isSelected ? 'checked' : ''} onchange="selectOption('${option.key}')">
          <span class="option-label">${option.text}</span>
        `;
        optionsContainer.appendChild(card);
      });

      document.getElementById('btnPrev').disabled = currentQuestionIndex === 0;
      document.getElementById('btnNext').disabled = !selectedAnswers[currentQuestionIndex];
      document.getElementById('btnNext').innerText = currentQuestionIndex === quizData.length - 1 ? "See Results" : "Next Question";
    }

    function selectOption(key) {
      selectedAnswers[currentQuestionIndex] = key;
      renderQuestion();
    }

    function nextQuestion() {
      if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function showResults() {
      document.getElementById('quizView').style.display = 'none';
      document.getElementById('resultsView').style.display = 'block';

      const counts = { 'A': 0, 'B': 0, 'C': 0, 'D': 0, 'E': 0 };
      Object.values(selectedAnswers).forEach(key => counts[key]++);

      let topKey = 'A';
      let maxVal = -1;
      Object.keys(counts).forEach(k => {
        if (counts[k] > maxVal) {
          maxVal = counts[k];
          topKey = k;
        }
      });

      document.getElementById('topCareerTitle').innerText = careerProfiles[topKey].title;
      document.getElementById('topCareerDesc').innerText = careerProfiles[topKey].desc;

      const scoresList = document.getElementById('scoresList');
      scoresList.innerHTML = '';

      Object.keys(counts).forEach(key => {
        const pct = Math.round((counts[key] / quizData.length) * 100);
        const card = document.createElement('div');
        card.className = 'score-card';
        card.innerHTML = `
          <div class="score-header">
            <span>${careerProfiles[key].title}</span>
            <span>${pct}% (${counts[key]}/${quizData.length})</span>
          </div>
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width: ${pct}%"></div>
          </div>
        `;
        scoresList.appendChild(card);
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      selectedAnswers = {};
      document.getElementById('resultsView').style.display = 'none';
      document.getElementById('quizView').style.display = 'block';
      renderQuestion();
    }

    function printResults() {
      window.print();
    }

    // Initialize
    renderQuestion();
  </script>
</body>
</html>
